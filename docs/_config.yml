title: EmbedXPL-Forge
description: "Embedded & Perimeter Security Assessment Framework — 4700+ modules, 1475+ CVEs, 129+ vendors"
baseurl: "/EmbedXPL-Forge"
url: "https://mrhenrike.github.io"

remote_theme: just-the-docs/just-the-docs@v0.10.0

# Site logo
# logo: "/assets/img/logo.png"

# Color scheme: dark fits an offensive security tool
color_scheme: dark

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_sensitive

# Footer
footer_content: "EmbedXPL-Forge &copy; 2026 <a href='https://github.com/mrhenrike'>André Henrique</a> — BSD-3-Clause"

# Callouts
callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Permalink
permalink: pretty

# Exclude from Jekyll build
exclude:
  - "*.py"
  - "*.csv"
  - HANDOFF-*.md
  - PLAN-*.md
  - UBUNTU-*.md
  - ANNOUNCEMENT.md
  - assets/

# Plugins (GitHub Pages safe list)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
