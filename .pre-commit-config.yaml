repos:
  - repo: local
    hooks:
      - id: embedxpl-syntax
        name: Python syntax check
        entry: python -m py_compile
        language: python
        types: [python]
        exclude: "^(embedxpl/malware_research/|embedxpl/native_src/)"

      - id: ruff
        name: Ruff linter
        entry: python -m ruff check
        language: python
        types: [python]
        args: ["--fix"]
        exclude: "^(embedxpl/malware_research/|embedxpl/modules/exploits/|embedxpl/engines/fingerprint/tenable/)"

      - id: embedxpl-smoke
        name: EmbedXPL smoke import
        entry: python -c "import embedxpl"
        language: python
        pass_filenames: false
        always_run: true

      - id: embedxpl-nse-audit
        name: NSE Lua audit
        entry: python tools/audit_nse.py
        language: python
        pass_filenames: false
        types: []
        files: "\\.nse$"
