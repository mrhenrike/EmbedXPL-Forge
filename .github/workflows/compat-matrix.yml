name: compatibility-matrix

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    name: "${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv
        run: uv venv .venv

      - name: Install runtime requirements
        run: |
          uv pip install -r requirements.txt
          uv pip install -e . --no-deps

      - name: Run compatibility smoke check
        run: uv run python tools/compat_smoke.py

      - name: Validate market priority yearly minimums
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python tools/validate_market_priority_minimums.py

  quality-security:
    name: "quality-security / ubuntu / py3.12"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Create virtualenv
        run: uv venv .venv

      - name: Install runtime requirements
        run: uv pip install -r requirements.txt

      - name: Install security audit tooling
        run: uv pip install pip-audit flake8 pytest bandit

      - name: Validate dependency graph integrity
        run: uv pip check

      - name: Install package (editable, no extra deps)
        run: uv pip install -e . --no-deps

      - name: Lint gate (critical errors)
        run: uv run flake8 tools exf.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Scoped tests gate
        run: uv run python tools/run_scoped_tests.py

      - name: Validate Python syntax compilation
        # Exclude intentionally-legacy Python 2 directories (Triton malware artifact,
        # Tenable PoCs, EDB exploits) — these are forensic research files, not runtime code.
        run: |
          uv run python -m compileall -q \
            -x "embedxpl/malware_research|embedxpl/engines/fingerprint/tenable|embedxpl/modules/exploits" \
            embedxpl tools

      - name: Validate market priority yearly minimums
        run: uv run python tools/validate_market_priority_minimums.py

      - name: Validate governance baseline
        run: uv run python tools/validate_governance.py

      - name: Build OSI/TCP-IP attack-test matrix snapshot
        run: uv run python tools/build_osi_tcpip_attack_matrix.py

      - name: Build curated arsenal index
        run: uv run python tools/build_arsenal_index.py

      - name: Validate curated arsenal architecture
        run: uv run python tools/validate_arsenal_architecture.py

      - name: Validate generated coverage matrix is up to date
        # Non-gating: regenerate and show diff for awareness.
        # The matrix is auto-generated and may differ by platform line-endings.
        # Run locally: python tools/generate_coverage_matrix.py && python tools/build_arsenal_index.py
        continue-on-error: true
        run: |
          uv run python tools/generate_coverage_matrix.py
          uv run python tools/build_arsenal_index.py
          git diff --stat -- docs/COVERAGE_MATRIX.md docs/COVERAGE_MATRIX.txt embedxpl/resources/catalogs/arsenal_index.json || true
          echo "Coverage matrix regenerated (diff shown above  -  non-gating)."

      - name: Dependency vulnerability audit
        run: uv run pip-audit -r requirements.txt --progress-spinner off

      - name: Static security review (bandit)
        run: uv run bandit -q -r tools -lll

      - name: Refresh deep intel and honeypot snapshots (non-gating)
        run: |
          uv run python tools/deep_intel_backlog.py
          uv run python tools/phase6b_honeypot_validation.py

  dependency-review:
    name: "dependency-review / pull_request"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
