name: security-audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ------------------------------------------------------------------ #
  # Backdoor / malicious-code detection on every PR diff                #
  # ------------------------------------------------------------------ #
  backdoor-scan:
    name: "Backdoor & malicious-code scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: pip install bandit semgrep

      - name: Bandit security scan (informational — pentest framework)
        # Non-blocking: bandit will always find HIGH issues in a pentest framework
        # (AutoAddPolicy, subprocess calls, etc. are intentional). The custom
        # pattern scan below is the actual malicious-code gate.
        continue-on-error: true
        run: |
          bandit -r embedxpl/ tools/ -ll \
            -x embedxpl/modules/exploits/,embedxpl/lab/,embedxpl/malware_research/,embedxpl/engines/fingerprint/tenable/ \
            --format txt --output bandit-report.txt || true
          echo "=== Bandit summary (non-gating) ==="
          tail -20 bandit-report.txt || true

      - name: Custom backdoor pattern scan
        run: |
          python - <<'PYEOF'
          import re
          import sys
          import subprocess
          from pathlib import Path

          # Patterns that signal malicious code hidden in a legitimate contribution
          SUSPICIOUS_PATTERNS = [
              # Reverse shell / bind shell patterns outside the exploits directory
              (r'socket\.connect\s*\(\s*\(', "Outbound socket connection — verify target is not attacker-controlled"),
              (r'subprocess\.(Popen|run|call)\s*.*?\bsh\b.*?-[ic]', "Shell invocation — potential reverse shell"),
              (r'os\.system\s*\(\s*[\'"].*?sh\b', "os.system shell execution — verify intent"),
              # Obfuscated/encoded payloads
              (r'base64\.b64decode\s*\(\s*b?["\'][A-Za-z0-9+/]{80,}', "Long base64 blob — potential encoded payload"),
              (r'eval\s*\(\s*(?:compile|exec|__import__)', "eval of dynamic code — potential code injection"),
              (r'exec\s*\(\s*(?:base64|zlib|marshal|compile)', "exec of encoded/compiled object — potential payload"),
              # C2 / beacon patterns
              (r'requests\.(get|post)\s*\(.*?(?:ngrok|burp|webhook\.site|requestcatcher|interact\.sh|oast\.)', "Known exfil/C2 endpoint in HTTP call"),
              (r'urllib.*?open\s*\(.*?(?:ngrok|burp|webhook\.site|requestcatcher|interact\.sh|oast\.)', "Known exfil/C2 endpoint in urllib call"),
              # Credential/key exfiltration
              (r'os\.environ.*?(TOKEN|SECRET|KEY|PASSWORD|API_KEY).*?(?:requests\.|urllib\.)', "Env secret read + network call — possible exfil"),
              # Persistence / download-and-execute
              (r'urllib.*?urlretrieve|wget\s|curl\s.*?-o\s.*?sh\b', "Download-and-execute pattern"),
              (r'crontab|/etc/cron|HKCU.*Run|HKLM.*Run', "Persistence mechanism outside intended module"),
          ]

          # Only scan files outside the sanctioned exploit/lab directories
          SCAN_EXCLUDE = {
              "embedxpl/modules/exploits",
              "embedxpl/lab",
              "embedxpl/malware_research",
          }

          findings = []
          root = Path(".")
          for path in root.rglob("*.py"):
              rel = str(path)
              if any(excl in rel for excl in SCAN_EXCLUDE):
                  continue
              try:
                  source = path.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  continue
              for pattern, description in SUSPICIOUS_PATTERNS:
                  for m in re.finditer(pattern, source, re.IGNORECASE):
                      line_no = source[:m.start()].count("\n") + 1
                      findings.append(f"[WARN] {rel}:{line_no} — {description}")
                      findings.append(f"       Match: {m.group(0)[:120]!r}")

          if findings:
              print("=" * 70)
              print("SECURITY AUDIT — SUSPICIOUS PATTERNS DETECTED")
              print("These require manual review by @mrhenrike before merging.")
              print("=" * 70)
              for f in findings:
                  print(f)
              # Non-blocking: flag for human review but do not auto-fail
              # (legitimate pentest tools may hit these patterns)
              print(f"\n{len(findings)//2} pattern(s) flagged. Review required.")
          else:
              print("[OK] No suspicious patterns detected.")
          PYEOF

      - name: Semgrep security rules
        run: |
          semgrep --config=p/python --config=p/secrets \
            --exclude="embedxpl/modules/exploits/**" \
            --exclude="embedxpl/lab/**" \
            --exclude="embedxpl/malware_research/**" \
            --severity=ERROR \
            embedxpl/ tools/ exf.py || true

      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

  # ------------------------------------------------------------------ #
  # Notify maintainer when a PR arrives from an external contributor    #
  # ------------------------------------------------------------------ #
  notify-maintainer:
    name: "Flag external PR for manual review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.author_association == 'NONE'

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 Thanks for your contribution!\n\n" +
                "This PR is from an external contributor and **requires manual security review by @mrhenrike** before merging.\n\n" +
                "Automated checks are running, but human review is mandatory:\n" +
                "- [ ] No backdoors, reverse shells, or C2 implants\n" +
                "- [ ] No credential exfiltration code\n" +
                "- [ ] No obfuscated payloads in non-exploit modules\n" +
                "- [ ] No unauthorized persistence mechanisms\n" +
                "- [ ] Code quality and intent match the stated purpose\n\n" +
                "_This check is enforced by CODEOWNERS — the PR cannot merge without @mrhenrike approval._"
            })
